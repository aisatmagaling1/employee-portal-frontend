<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purchase Requests</title>
<style>
  :root {
    --bg: #090A10;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --text: #ECEDF2;
    --text-soft: #8B8E9C;
    --violet: #7C6CF0;
    --violet-soft: rgba(124,108,240,0.18);
    --amber: #F2A93B;
    --amber-soft: rgba(242,169,59,0.16);
    --error: #F0685C;
    --error-soft: rgba(240,104,92,0.15);
    --ok: #52C793;
    --ok-soft: rgba(82,199,147,0.15);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #EDEFF5;
    --panel: rgba(255,255,255,0.75);
    --panel-border: rgba(20,22,30,0.08);
    --text: #14161E;
    --text-soft: #6A6D7C;
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  .glow {
    position: fixed; inset: -20%; z-index: 0;
    background: radial-gradient(32% 26% at 15% 10%, rgba(124,108,240,0.22), transparent 60%),
                radial-gradient(26% 22% at 88% 6%, rgba(242,169,59,0.10), transparent 60%);
    filter: blur(50px); pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 26px 22px 60px; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .brand span { font-weight: 650; font-size: 1.02rem; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn, .nav-link {
    padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text-soft); font-size: 0.82rem; text-decoration: none; cursor: pointer; backdrop-filter: blur(10px);
  }
  .user-chip {
    padding: 6px 12px; border-radius: 999px; background: var(--violet-soft); color: var(--violet);
    font-size: 0.78rem; font-weight: 650;
  }

  h1.page-title { font-size: 1.5rem; margin: 0 0 4px; }
  p.page-sub { margin: 0 0 22px; color: var(--text-soft); font-size: 0.92rem; }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px 22px; backdrop-filter: blur(14px); margin-bottom: 20px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .panel-head h2 { font-size: 1.05rem; margin: 0; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 0.9rem; color: var(--text);
    background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 9px 11px; outline: none;
  }
  :root[data-theme="light"] input, :root[data-theme="light"] select, :root[data-theme="light"] textarea { background: rgba(20,22,30,0.03); }
  textarea { resize: vertical; min-height: 60px; }
  label.field-label { font-size: 0.78rem; color: var(--text-soft); margin-bottom: 4px; display: block; }

  .btn {
    padding: 9px 16px; border-radius: 9px; border: none; font: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .btn-primary { background: var(--violet); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ok { background: var(--ok); color: #08150F; }
  .btn-danger { background: var(--error); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--panel-border); color: var(--text-soft); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 0.76rem; color: var(--text-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--panel-border); }
  tbody td { padding: 12px 10px; border-bottom: 1px solid var(--panel-border); font-size: 0.88rem; vertical-align: top; }
  tbody tr.main-row { cursor: pointer; transition: background 0.15s ease; }
  tbody tr.main-row:hover { background: rgba(124,108,240,0.05); }

  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.pending { background: var(--amber-soft); color: var(--amber); }
  .badge.rejected { background: var(--error-soft); color: var(--error); }

  .detail-row td { background: rgba(124,108,240,0.03); }
  .detail-box { display: flex; flex-direction: column; gap: 14px; }
  .timeline { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; color: var(--text-soft); }
  .timeline .t-item { display: flex; gap: 8px; }
  .timeline .t-item b { color: var(--text); }

  .quotation-item {
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .quotation-item.selected { border-color: var(--ok); background: var(--ok-soft); }

  .action-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .action-box input[type="text"], .action-box input[type="number"] { width: auto; flex: 1; min-width: 100px; }

  .empty-note { text-align: center; padding: 20px; color: var(--text-soft); font-size: 0.88rem; }
  .msg { font-size: 0.82rem; margin-top: 8px; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--ok); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" fill="none">
        <rect x="1" y="1" width="24" height="24" rx="6" stroke="#7C6CF0" stroke-width="1.6"/>
        <path d="M7.5 17V9L13 12.5L18.5 9V17" stroke="#7C6CF0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Employee Portal</span>
    </div>
    <div class="top-actions">
      <a class="nav-link" href="dashboard.html">Tracker</a>
      <a class="nav-link" href="roles.html" id="manageRolesLink" style="display:none;">Manage Roles</a>
      <span class="user-chip" id="userChip">—</span>
      <button class="icon-btn" id="themeToggle">Theme</button>
      <button class="icon-btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <h1 class="page-title">Purchase Requests</h1>
  <p class="page-sub">Submit, track, and approve purchase requests from start to finish.</p>

  <div class="panel" id="newRequestPanel">
    <div class="panel-head"><h2>New Request</h2></div>
    <div class="form-grid">
      <div><label class="field-label">Item name</label><input type="text" id="reqItemName" placeholder="e.g. Laptop charger"></div>
      <div><label class="field-label">Category</label><input type="text" id="reqCategory" placeholder="e.g. IT Equipment"></div>
      <div><label class="field-label">Quantity</label><input type="number" id="reqQty" min="1" value="1"></div>
    </div>
    <div style="margin-bottom:12px;">
      <label class="field-label">Reason (optional)</label>
      <textarea id="reqReason" placeholder="Why is this needed?"></textarea>
    </div>
    <button class="btn btn-primary" id="submitReqBtn">Submit request</button>
    <div class="msg" id="newReqMsg"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>All Requests</h2>
      <button class="btn btn-ghost" id="refreshBtn">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Item</th><th>Requested by</th><th>Qty</th><th>Status</th></tr></thead>
      <tbody id="reqTableBody"></tbody>
    </table>
    <div class="empty-note" id="emptyNote" style="display:none;">No requests yet.</div>
  </div>

</div>

<script>
  const API_BASE = 'https://employee-portal-backend-3uzr.onrender.com';
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role') || '';
  const firstName = localStorage.getItem('firstName') || localStorage.getItem('employeeId') || 'Account';
  const FULL_ACCESS_ROLES = ['admin', 'ceo'];

  if (!token) {
    window.location.href = 'login.html';
  }

  document.getElementById('userChip').textContent = firstName;
  if (FULL_ACCESS_ROLES.includes(role)) {
    document.getElementById('manageRolesLink').style.display = 'inline-block';
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  const STATUS_LABELS = {
    submitted: ['Submitted', 'pending'],
    in_stock_fulfilled: ['Fulfilled (Stock)', 'ok'],
    pending_ceo_stock_approval: ['Awaiting CEO (Stock)', 'pending'],
    rejected_by_ceo_stock: ['Rejected (Stock)', 'rejected'],
    pending_purchasing: ['Awaiting Purchasing', 'pending'],
    pending_ceo_purchase_approval: ['Awaiting CEO (Purchase)', 'pending'],
    rejected_by_ceo_purchase: ['Rejected (Purchase)', 'rejected'],
    pending_accounting: ['Awaiting Accounting', 'pending'],
    pending_receipt: ['Awaiting Receipt', 'pending'],
    completed: ['Completed', 'ok'],
  };

  let requests = [];
  let expandedId = null;

  async function loadRequests() {
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests`, { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Could not load requests.');
      requests = data.requests;
      render();
    } catch (err) {
      document.getElementById('emptyNote').textContent = err.message;
      document.getElementById('emptyNote').style.display = 'block';
    }
  }

  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  }

  function actionsFor(pr) {
    const boxes = [];
    const fullAccess = FULL_ACCESS_ROLES.includes(role);

    if (fullAccess) {
      const options = Object.entries(STATUS_LABELS).map(([val, [label]]) => `<option value="${val}" ${pr.status === val ? 'selected' : ''}>${label}</option>`).join('');
      boxes.push(`
        <div class="action-box" style="border:1px dashed var(--violet); border-radius:8px; padding:10px;">
          <b style="width:100%; color:var(--violet); font-size:0.8rem;">Admin/CEO override — jump straight to any status</b>
          <select class="admin-status-select" data-id="${pr._id}">${options}</select>
          <input type="text" placeholder="Note (optional)" class="admin-note" data-id="${pr._id}">
          <button class="btn btn-primary" onclick="adminOverride('${pr._id}')">Set status</button>
        </div>`);
    }

    if ((role === 'ceo' || role === 'admin') && pr.status === 'pending_ceo_stock_approval') {
      boxes.push(`
        <div class="action-box">
          <input type="text" placeholder="Note (optional)" class="note-input" data-id="${pr._id}">
          <button class="btn btn-ok" onclick="ceoDecide('${pr._id}', 'stock', 'approve')">Approve</button>
          <button class="btn btn-danger" onclick="ceoDecide('${pr._id}', 'stock', 'reject')">Reject</button>
        </div>`);
    }

    if ((role === 'purchasing' || role === 'admin' || role === 'ceo') && pr.status === 'pending_purchasing') {
      boxes.push(`
        <div class="action-box">
          <input type="text" placeholder="Vendor name" class="q-vendor" data-id="${pr._id}">
          <input type="number" placeholder="Amount" class="q-amount" data-id="${pr._id}" style="max-width:110px;">
          <input type="text" placeholder="Terms" class="q-terms" data-id="${pr._id}">
          <button class="btn btn-ghost" onclick="addQuotation('${pr._id}')">Add quotation</button>
        </div>
        <div class="action-box">
          <button class="btn btn-primary" onclick="submitQuotations('${pr._id}')" ${pr.quotations.length === 0 ? 'disabled' : ''}>Submit ${pr.quotations.length} quotation(s) to CEO</button>
        </div>`);
    }

    if ((role === 'ceo' || role === 'admin') && pr.status === 'pending_ceo_purchase_approval') {
      const options = pr.quotations.map(q => `<option value="${q._id}">${q.vendorName} — ${q.amount}</option>`).join('');
      boxes.push(`
        <div class="action-box">
          <select class="q-select" data-id="${pr._id}">${options}</select>
          <input type="text" placeholder="Note (optional)" class="note-input" data-id="${pr._id}">
          <button class="btn btn-ok" onclick="ceoDecide('${pr._id}', 'purchase', 'approve')">Approve selected</button>
          <button class="btn btn-danger" onclick="ceoDecide('${pr._id}', 'purchase', 'reject')">Reject all</button>
        </div>`);
    }

    if ((role === 'accounting' || role === 'admin' || role === 'ceo') && pr.status === 'pending_accounting') {
      boxes.push(`
        <div class="action-box">
          <input type="number" placeholder="Amount paid" class="acc-amount" data-id="${pr._id}" style="max-width:130px;">
          <input type="text" placeholder="Note (optional)" class="acc-note" data-id="${pr._id}">
          <button class="btn btn-primary" onclick="processAccounting('${pr._id}')">Mark processed</button>
        </div>`);
    }

    if ((role === 'purchasing' || role === 'admin' || role === 'ceo') && pr.status === 'pending_receipt') {
      boxes.push(`
        <div class="action-box">
          <input type="text" placeholder="Note (optional)" class="recv-note" data-id="${pr._id}">
          <button class="btn btn-ok" onclick="markReceived('${pr._id}')">Mark received</button>
        </div>`);
    }

    return boxes.join('');
  }

  function render() {
    const tbody = document.getElementById('reqTableBody');
    const empty = document.getElementById('emptyNote');
    tbody.innerHTML = '';
    empty.style.display = requests.length === 0 ? 'block' : 'none';

    requests.forEach(pr => {
      const [label, cls] = STATUS_LABELS[pr.status] || [pr.status, 'pending'];
      const tr = document.createElement('tr');
      tr.className = 'main-row';
      tr.innerHTML = `
        <td>${pr.itemName}<div style="color:var(--text-soft); font-size:0.78rem;">${pr.category}</div></td>
        <td>${pr.requesterName || pr.requestedBy}</td>
        <td>${pr.quantityRequested}</td>
        <td><span class="badge ${cls}">${label}</span></td>`;
      tr.addEventListener('click', () => { expandedId = expandedId === pr._id ? null : pr._id; render(); });
      tbody.appendChild(tr);

      if (expandedId === pr._id) {
        const dtr = document.createElement('tr');
        dtr.className = 'detail-row';
        const quotationsHtml = pr.quotations.map(q => `
          <div class="quotation-item ${q.selected ? 'selected' : ''}">
            <div><b>${q.vendorName}</b> — ${q.amount} — ${q.terms}</div>
            <div style="color:var(--text-soft); font-size:0.76rem;">${q.selected ? 'Selected' : ''}</div>
          </div>`).join('') || '<div style="color:var(--text-soft); font-size:0.82rem;">No quotations yet.</div>';

        const historyHtml = pr.history.map(h => `
          <div class="t-item"><b>${(STATUS_LABELS[h.status] || [h.status])[0]}</b> — ${h.changedBy} — ${fmtDate(h.at)}${h.note ? ' — ' + h.note : ''}</div>`).join('');

        dtr.innerHTML = `<td colspan="4"><div class="detail-box">
            <div>${pr.reason ? '<b>Reason:</b> ' + pr.reason : ''}</div>
            <div><b>Quotations</b>${quotationsHtml}</div>
            <div><b>Timeline</b><div class="timeline">${historyHtml}</div></div>
            <div id="actions-${pr._id}">${actionsFor(pr)}</div>
            <div class="msg" id="msg-${pr._id}"></div>
          </div></td>`;
        tbody.appendChild(dtr);
      }
    });
  }

  function showMsg(id, text, isError) {
    const el = document.getElementById('msg-' + id);
    if (el) {
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'error' : 'success');
    }
  }

  async function ceoDecide(id, stage, decision) {
    const note = document.querySelector(`.note-input[data-id="${id}"]`).value;
    const body = { decision, note };
    if (stage === 'purchase') {
      body.selectedQuotationId = document.querySelector(`.q-select[data-id="${id}"]`).value;
    }
    const endpoint = stage === 'stock' ? 'ceo-approve-stock' : 'ceo-approve-purchase';
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/${endpoint}`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadRequests();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  async function addQuotation(id) {
    const vendorName = document.querySelector(`.q-vendor[data-id="${id}"]`).value;
    const amount = document.querySelector(`.q-amount[data-id="${id}"]`).value;
    const terms = document.querySelector(`.q-terms[data-id="${id}"]`).value;
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/quotations`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ vendorName, amount, terms }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadRequests();
      expandedId = id; render();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  async function submitQuotations(id) {
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/submit-quotations`, {
        method: 'POST', headers: authHeaders(),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadRequests();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  async function processAccounting(id) {
    const amountPaid = document.querySelector(`.acc-amount[data-id="${id}"]`).value;
    const note = document.querySelector(`.acc-note[data-id="${id}"]`).value;
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/accounting-process`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ amountPaid, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadRequests();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  async function markReceived(id) {
    const note = document.querySelector(`.recv-note[data-id="${id}"]`).value;
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/mark-received`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadRequests();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  async function adminOverride(id) {
    const newStatus = document.querySelector(`.admin-status-select[data-id="${id}"]`).value;
    const note = document.querySelector(`.admin-note[data-id="${id}"]`).value;
    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests/${id}/admin-override`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ newStatus, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      expandedId = id;
      await loadRequests();
    } catch (err) {
      showMsg(id, err.message, true);
    }
  }

  document.getElementById('submitReqBtn').addEventListener('click', async () => {
    const itemName = document.getElementById('reqItemName').value.trim();
    const category = document.getElementById('reqCategory').value.trim();
    const quantityRequested = Number(document.getElementById('reqQty').value);
    const reason = document.getElementById('reqReason').value.trim();
    const msgEl = document.getElementById('newReqMsg');

    if (!itemName || !category || !quantityRequested) {
      msgEl.textContent = 'Fill in item name, category, and quantity.';
      msgEl.className = 'msg error';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/purchase-requests`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ itemName, category, quantityRequested, reason, requesterName: localStorage.getItem('employeeName') }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      msgEl.textContent = 'Request submitted.';
      msgEl.className = 'msg success';
      document.getElementById('reqItemName').value = '';
      document.getElementById('reqCategory').value = '';
      document.getElementById('reqQty').value = '1';
      document.getElementById('reqReason').value = '';
      await loadRequests();
    } catch (err) {
      msgEl.textContent = err.message;
      msgEl.className = 'msg error';
    }
  });

  document.getElementById('refreshBtn').addEventListener('click', loadRequests);
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('employeeName');
    localStorage.removeItem('firstName');
    localStorage.removeItem('employeeId');
    localStorage.removeItem('role');
    window.location.href = 'login.html';
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  loadRequests();
</script>
</body>
</html>
